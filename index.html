
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coast-Down Pro</title>
<style>
body { font-family: sans-serif; background: #121212; color: #fff; padding: 10px; text-align: center; margin: 0; }
.card { background: #1e1e1e; padding: 12px; border-radius: 10px; margin: 8px auto; max-width: 95%; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; padding: 5px; }
input { width: 100%; padding: 6px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; text-align: center; box-sizing: border-box; }
button { background: #00e676; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 8px; width: 100%; font-size: 15px; box-sizing: border-box; }
.btn-gps-status { background: #f44336; color: #fff; font-size: 13px; padding: 8px; transition: background 0.3s ease; }
.btn-gps-status.gps-ready { background: #4caf50; color: #fff; }
.btn-orange { background: #ff9100; color: #fff; font-size: 13px; padding: 8px; margin-top: 5px; }
.btn-map { background: #ab47bc; color: #fff; font-size: 12px; padding: 8px; margin: 4px 0; }
.btn-map.active { background: #e91e63; }
.highlight { font-size: 22px; color: #00e676; font-weight: bold; }
.status-box { padding: 8px; border-radius: 5px; margin: 5px 0; font-weight: bold; font-size: 12px; box-sizing: border-box; }
.active-zone { background: #d32f2f; color: #fff; animation: blink 1s infinite; }
.inactive-zone { background: #333; color: #aaa; }
.run-badge { display: inline-block; padding: 3px 6px; background: #555; border-radius: 3px; margin: 2px; font-size: 11px; }
.run-active { background: #00e676; color: #000; font-weight: bold; }
#debugRuns { font-size: 11px; color: #aaa; text-align: left; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; overflow-x: auto; }
@keyframes blink { 50% { opacity: 0.6; } }
</style>
</head>
<body>
<h1>Coast-Down Kalman</h1>
<div class="card">
<h3>1. Configurazione</h3>
<button id="weatherBtn" class="btn-gps-status" onclick="fetchLiveWeather()">🔴 Ricerca Satelliti / Dai i Permessi...</button>
<div class="grid-inputs">
<div><label>Massa (kg):</label><input type="number" id="mass" value="1500"></div>
<div><label>Area A (m²):</label><input type="number" id="area" value="2.2" step="0.05"></div>
</div>
<div style="font-size:11px; color:#aaa; text-align:left;">
Densità Aria (&rho;): <span id="rhoDisplay" style="color:#00e676;">1.2250</span> kg/m³
</div>
</div>
<div class="card">
<h3>2. Sessione</h3>
<div>
<span id="badge-A" class="run-badge run-active">Mappa (A)</span>
<span id="badge-B" class="run-badge">Auto (B)</span>
<span id="badge-A2" class="run-badge">Auto (A2)</span>
</div>
<div id="mappingControls">
<button id="mapCxBtn" class="btn-map" onclick="toggleMapZone('Cx')">Log Cx (Alta)</button>
<button id="mapCrrBtn" class="btn-map" onclick="toggleMapZone('Crr')">Log Crr (Bassa)</button>
</div>
<button id="actionBtn" onclick="advanceStep()">Avvia Mappatura</button>
<button class="btn-orange" onclick="resetSession()">Reset Intero</button>
</div>
<div class="card">
<h3>3. Monitor (Filtrato)</h3>
<p>Velocità: <span id="speedDisplay" class="highlight">0.0</span> km/h</p>
<p>Accelerazione: <span id="accelDisplay" style="color:#ff1744; font-weight:bold;">0.00</span> m/s²</p>
<p style="font-size:12px;">Stato: <span id="logStatus" style="font-weight:bold; color:#aaa;">Inattivo</span></p>
<div id="zoneCxDisplay" class="status-box inactive-zone">ZONA Cx (Punti: <span id="cxPoints">0</span>)</div>
<div id="zoneCrrDisplay" class="status-box inactive-zone">ZONA Crr (Punti: <span id="crrPoints">0</span>)</div>
</div>
<div class="card">
<h3>4. Risultati</h3>
<p>Crr Medio: <span id="crrResult" class="highlight">-</span></p>
<p>Cx Medio: <span id="cxResult" class="highlight">-</span></p>
<div id="debugRuns"></div>
</div>








<script>
let watchId = null, currentStage = "IDLE"; 
let isMappingCx = false, isMappingCrr = false;
let calculatedRho = 1.225; const g = 9.81;
let kalmanX = 0, kalmanP = 1, kalmanQ = 0.01, kalmanR = 0.25;
let isKalmanInitialized = false, smoothedAccel = null; const alphaAccel = 0.4;
let geoZones = { cx: { points: [] }, crr: { points: [] }, radiusMeters: 60 };
let sessionData = { A: { cxPoints: [], crrPoints: [] }, B: { cxPoints: [], crrPoints: [] }, A2: { cxPoints: [], crrPoints: [] } };
let lastTime = null;

let currentLatestLat = null;
let currentLatestLon = null;
let hasGpsFix = false;

window.onload = function() {
startGps();
};

function getDistanceMeters(lat1, lon1, lat2, lon2) {
const R = 6371000;
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLon = (lon2 - lon1) * Math.PI / 180;
const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function isInsideZone(lat, lon, zonePoints) {
if (zonePoints.length === 0) return false;
for (let p of zonePoints) {
if (getDistanceMeters(lat, lon, p.lat, p.lon) <= geoZones.radiusMeters) return true;
}
return false;
}

function filterGpsData(rawSpeed, dt) {
if (!isKalmanInitialized) { kalmanX = rawSpeed; isKalmanInitialized = true; return rawSpeed; }
kalmanP = kalmanP + kalmanQ;
let kalmanK = kalmanP / (kalmanP + kalmanR);
kalmanX = kalmanX + kalmanK * (rawSpeed - kalmanX);
kalmanP = (1 - kalmanK) * kalmanP;
return kalmanX;
}

function advanceStep() {
const btn = document.getElementById("actionBtn");
if (currentStage === "IDLE") {
currentStage = "MAPPING_A";
btn.textContent = "Mappa A ➡️ Passa a Run B";
btn.style.backgroundColor = "#ff9100";
} else if (currentStage === "MAPPING_A") {
isMappingCx = false; isMappingCrr = false;
document.getElementById("mappingControls").style.display = "none";
currentStage = "RUN_B"; updateBadges("B");
btn.textContent = "Attendi Run B ➡️ Passa ad A2";
} else if (currentStage === "RUN_B") {
currentStage = "RUN_A2"; updateBadges("A2");
btn.textContent = "Calcola Risultati Finali";
btn.style.backgroundColor = "#00e676";
} else if (currentStage === "RUN_A2") {
currentStage = "FINISHED"; stopGps();
btn.textContent = "Completato"; btn.disabled = true;
calculateFinalValues();
}
}

function toggleMapZone(zone) {
if (currentStage !== "MAPPING_A") return;
const btn = document.getElementById(`map${zone}Btn`);
if (zone === "Cx") {
isMappingCx = !isMappingCx; isMappingCrr = false;
document.getElementById("mapCrrBtn").classList.remove("active");
btn.classList.toggle("active", isMappingCx);
} else {
isMappingCrr = !isMappingCrr; isMappingCx = false;
document.getElementById("mapCxBtn").classList.remove("active");
btn.classList.toggle("active", isMappingCrr);
}
}

function updateBadges(run) {
document.querySelectorAll(".run-badge").forEach(b => b.classList.remove("run-active"));
const id = run === "B" ? "badge-B" : (run === "A2" ? "badge-A2" : "badge-A");
document.getElementById(id).classList.add("run-active");
}

function startGps() {
if (navigator.geolocation) {
watchId = navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
enableHighAccuracy: true, maximumAge: 0, timeout: 7000
});
}
}

function stopGps() { if (watchId) navigator.geolocation.clearWatch(watchId); }

function onGpsError(err) {
hasGpsFix = false;
const wBtn = document.getElementById("weatherBtn");
wBtn.className = "btn-gps-status";
wBtn.textContent = "🔴 GPS Assente. Controlla i permessi!";
}

function onGpsUpdate(position) {
const lat = position.coords.latitude; const lon = position.coords.longitude;
const rawSpeed = position.coords.speed; const time = position.timestamp / 1000;

currentLatestLat = lat;
currentLatestLon = lon;

if (!hasGpsFix) {
hasGpsFix = true;
const wBtn = document.getElementById("weatherBtn");
wBtn.className = "btn-gps-status gps-ready";
wBtn.textContent = "🟢 GPS Agganciato! Clicca per Meteo Live";
}

if (rawSpeed !== null && rawSpeed >= 0) {
document.getElementById("speedDisplay").textContent = (rawSpeed * 3.6).toFixed(1);
}

if (rawSpeed === null || rawSpeed < 0) return;
if (lastTime !== null) {
const dt = time - lastTime;
if (dt > 0) {
const filteredSpeed = filterGpsData(rawSpeed, dt);
const rawAccel = (filteredSpeed - kalmanX) / dt; 
smoothedAccel = (smoothedAccel === null) ? rawAccel : (alphaAccel * rawAccel) + ((1 - alphaAccel) * smoothedAccel);
document.getElementById("accelDisplay").textContent = smoothedAccel.toFixed(2);
let statusLabel = "Inattivo";

if (currentStage === "MAPPING_A") {
if (isMappingCx) {
geoZones.cx.points.push({lat, lon}); sessionData.A.cxPoints.push({v: filteredSpeed, a: smoothedAccel});
setZoneState("Cx", true); statusLabel = "Mappa Cx...";
} else { setZoneState("Cx", false); }
if (isMappingCrr) {
geoZones.crr.points.push({lat, lon}); sessionData.A.crrPoints.push({v: filteredSpeed, a: smoothedAccel});
setZoneState("Crr", true); statusLabel = "Mappa Crr...";
} else { setZoneState("Crr", false); }
}
else if (currentStage === "RUN_B" || currentStage === "RUN_A2") {
const runKey = currentStage === "RUN_B" ? "B" : "A2";
const inCx = isInsideZone(lat, lon, geoZones.cx.points);
const inCrr = isInsideZone(lat, lon, geoZones.crr.points);
if (inCx && filteredSpeed > 5) {
sessionData[runKey].cxPoints.push({v: filteredSpeed, a: smoothedAccel});
setZoneState("Cx", true); setZoneState("Crr", false); statusLabel = "AUTO-LOG: Cx!";
} else if (inCrr && filteredSpeed > 2) {
sessionData[runKey].crrPoints.push({v: filteredSpeed, a: smoothedAccel});
setZoneState("Cx", false); setZoneState("Crr", true); statusLabel = "AUTO-LOG: Crr!";
} else { setZoneState("Cx", false); setZoneState("Crr", false); }
}

document.getElementById("logStatus").textContent = statusLabel;
const rKey = currentStage === "MAPPING_A" ? "A" : (currentStage === "RUN_B" ? "B" : (currentStage === "RUN_A2" ? "A2" : null));
if (rKey) {
document.getElementById("cxPoints").textContent = sessionData[rKey].cxPoints.length;
document.getElementById("crrPoints").textContent = sessionData[rKey].crrPoints.length;
}
}
}
lastTime = time;
}

function setZoneState(zone, isActive) {
document.getElementById(`zone${zone}Display`).className = isActive ? "status-box active-zone" : "status-box inactive-zone";
}

function calculateFinalValues() {
const m = parseFloat(document.getElementById("mass").value);
const A = parseFloat(document.getElementById("area").value);
let runs = ["A", "B"]; if (sessionData.A2.cxPoints.length > 3) runs.push("A2");
let results = { cx: [], crr: [] }; let debug = "";
runs.forEach(r => {
const cxD = sessionData[r].cxPoints; const crrD = sessionData[r].crrPoints;
let cxVal = 0.30;
if (cxD.length > 3) {
let sumV2 = 0, sumF = 0; cxD.forEach(p => { sumV2 += p.v*p.v; sumF += -m*p.a; });
cxVal = ((2 * (sumF / cxD.length)) / (calculatedRho * A * (sumV2 / cxD.length))) - 0.035;
if(cxVal < 0.15) cxVal = 0.24; results.cx.push(cxVal);
}
let crrVal = 0.0120;
if (crrD.length > 3) {
let sumF = 0; crrD.forEach(p => { sumF += -m*p.a; });
crrVal = (sumF / crrD.length) / (m * g);
if(crrVal < 0.003) crrVal = 0.0085; results.crr.push(crrVal);
}
debug += `Lancio ${r} -> Cx: ${cxVal.toFixed(2)} | Attrito: ${crrVal.toFixed(4)}\n`;
});
const fCx = results.cx.reduce((a,b)=>a+b,0)/results.cx.length;
const fCrr = results.crr.reduce((a,b)=>a+b,0)/results.crr.length;
document.getElementById("cxResult").textContent = fCx.toFixed(2);
document.getElementById("crrResult").textContent = fCrr.toFixed(4);
document.getElementById("debugRuns").innerText = debug;
}

function resetSession() { location.reload(); }

function calculateAccurateManualDensity(tC, pHpa, rh) {
const Rd = 287.058; const Rv = 461.495;
const T_k = tC + 273.15; const P_pa = pHpa * 100;
const Rh_f = rh / 100;
const P_sat = 610.78 * Math.exp((17.27 * tC) / (tC + 237.3));
const Pv = P_sat * Rh_f; const Pd = P_pa - Pv;
calculatedRho = (Pd / (Rd * T_k)) + (Pv / (Rv * T_k));
document.getElementById("rhoDisplay").textContent = calculatedRho.toFixed(4);
const alpha = ((17.27 * tC) / (237.3 + tC)) + Math.log(Rh_f > 0 ? Rh_f : 0.001);
const T_dp = (237.3 * alpha) / (17.27 - alpha);
alert("Rho Aria: " + calculatedRho.toFixed(4) + " kg/m³\nRugiada: " + T_dp.toFixed(1) + " °C");
}

async function fetchLiveWeather() {
if (!hasGpsFix || currentLatestLat === null) {
alert("Attendi l'aggancio satellitare!"); return;
}
try {
const urlCompleto = "https://open-meteo.com" + currentLatestLat + "&longitude=" + currentLatestLon + "&current=temperature_2m,relative_humidity_2m,surface_pressure";
const res = await fetch(urlCompleto); const d = await res.json();
if (d && d.current) {
const Tk = d.current.temperature_2m + 273.15; const Ppa = d.current.surface_pressure * 100;
const Psat = 610.78 * Math.exp((17.27 * d.current.temperature_2m) / (d.current.temperature_2m + 237.3));
const Pv = Psat * (d.current.relative_humidity_2m / 100);
calculatedRho = ((Ppa - Pv) / (287.058 * Tk)) + (Pv / (461.495 * Tk));
document.getElementById("rhoDisplay").textContent = calculatedRho.toFixed(4);
alert("Meteo Sincronizzato con successo!");
} else { throw new Error("Dati vuoti"); }
} catch (e) { 
const pT = prompt("Meteo respinto.\n1 di 3 - Temperatura (°C):", "20");
if (pT !== null) {
const t = parseFloat(pT);
const pP = prompt("2 di 3 - Pressione Locale (hPa):", "1013.25");
if (pP !== null) {
const p = parseFloat(pP);
const pH = prompt("3 di 3 - Umidità Relativa (%):", "50");
if (pH !== null) {
const h = parseFloat(pH);
if (!isNaN(t) && !isNaN(p) && !isNaN(h)) {
calculateAccurateManualDensity(t, p, h);
} else { alert("Valori non validi."); }
}
}
}
}
}
</script>
</body>
</html>
